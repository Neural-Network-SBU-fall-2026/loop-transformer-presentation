name: Validate presentation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: sudo apt-get update && sudo apt-get install -y libreoffice
      - run: npm run pdf
      - uses: actions/upload-artifact@v4
        with:
          name: presentation-deliverables
          path: |
            exports/How-to-Loop-Your-Transformer.pptx
            exports/How-to-Loop-Your-Transformer.pdf
          if-no-files-found: error
