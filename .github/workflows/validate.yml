name: Extract paper assets, validate and package presentation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PDF extraction dependency
        run: python -m pip install --upgrade pymupdf
      - name: Download the exact paper PDF
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p work
          curl --retry 3 --retry-delay 2 -fL https://arxiv.org/pdf/2610.40325v1 -o work/paper.pdf || \
          curl --retry 3 --retry-delay 2 -fL https://borowiecki.dev/pdf/2610.40325 -o work/paper.pdf
          test -s work/paper.pdf
      - name: Extract every original figure and table
        if: github.event_name != 'pull_request'
        run: python .github/scripts/extract-paper-assets.py work/paper.pdf
      - name: Commit all extracted image assets
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/paper-original
          if ! git diff --cached --quiet; then
            git commit -m "assets: add all extracted figures and tables from paper PDF"
            git push
          fi
      - run: npm install
      - run: npm run build
      - run: sudo apt-get update && sudo apt-get install -y libreoffice
      - run: npm run pdf
      - uses: actions/upload-artifact@v4
        with:
          name: presentation-deliverables
          path: |
            exports/How-to-Loop-Your-Transformer.pptx
            exports/How-to-Loop-Your-Transformer.pdf
          if-no-files-found: error
