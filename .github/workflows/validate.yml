name: Validate presentation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm run pptx
      - uses: actions/upload-artifact@v4
        with:
          name: presentation-powerpoint
          path: exports/How-to-Loop-Your-Transformer.pptx
          if-no-files-found: error
