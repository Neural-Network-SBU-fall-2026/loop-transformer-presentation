<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560"><defs><style>.h{font:700 25px Arial;fill:#292c28}.t{font:17px Arial;fill:#444}.s{font:14px Arial;fill:#777}.global{fill:#eaf2f8;stroke:#4387b8;stroke-width:3;animation:cache 4s ease-in-out infinite alternate}@keyframes cache{to{fill:#dcecf8;stroke-width:5}}.local{fill:#fff0e4;stroke:#d97736;stroke-width:3}.gate{fill:#f0eafa;stroke:#8064a8;stroke-width:3}.out{fill:#edf5ef;stroke:#269d79;stroke-width:3}</style></defs><text x="45" y="50" class="h">GLOBAL SHARED CACHE + LOOP-LOCAL WINDOW</text><rect x="45" y="85" width="1010" height="105" rx="16" class="global"/><text x="550" y="125" text-anchor="middle" class="t">Full KV cache produced by Loop 1</text><text x="550" y="158" text-anchor="middle" class="s">Reused by later loops — global context</text><g transform="translate(60 245)"><rect x="0" y="0" width="275" height="105" rx="14" class="local"/><text x="137" y="42" text-anchor="middle" class="t">Loop-local KV cache</text><text x="137" y="73" text-anchor="middle" class="s">Recent w tokens</text><path d="M137 -55v55" stroke="#4387b8" stroke-width="4"/><rect x="365" y="0" width="250" height="105" rx="14" class="gate"/><text x="490" y="42" text-anchor="middle" class="t">G-SWA gate</text><text x="490" y="73" text-anchor="middle" class="s">Head-wise mixing</text><path d="M275 52h90" stroke="#d97736" stroke-width="4"/><rect x="705" y="0" width="275" height="105" rx="14" class="out"/><text x="842" y="42" text-anchor="middle" class="t">Combined attention</text><text x="842" y="73" text-anchor="middle" class="s">Global + local context</text><path d="M615 52h90" stroke="#269d79" stroke-width="4"/></g><text x="60" y="435" class="h">CACHE COMPLEXITY</text><text x="60" y="480" class="t">Separate full caches: O(LND)</text><text x="560" y="480" class="t">Shared global + local windows: O(ND + (L−1)wD)</text><text x="60" y="525" class="s">Conceptual mechanism diagram — not a measured performance plot.</text></svg>